UIActivity.exo.label.Welcome_Activity_Welcome_Onboard=Sveiki prisijung\u0119, {0}!
UIActivity.exo.label.paragraph1=D\u0117kojame, kad prisijung\u0117te prie eXo Platform.
UIActivity.exo.label.paragraph2=eXo Platform yra skaitmenin\u0117s darbo vietos sprendimas, padedantis sujungti ir \u012ftraukti j\u016bs\u0173 komandas per centralizuot\u0105 s\u0105saj\u0105.
UIActivity.exo.label.paragraph3=eXo Platform gerina vidin\u0119 komunikacij\u0105, skatina bendradarbiavim\u0105 ir padeda valdyti verslo \u017einias.
UIActivity.exo.label.paragraph4=Tai j\u016bs\u0173 veiklos srautas. Jis pad\u0117s steb\u0117ti svarbius \u012fvykius j\u016bs\u0173 erdv\u0117se.
UIActivity.exo.label.paragraph5=Kurkite savo tinkl\u0105 u\u017emegzdami ry\u0161ius su kolegomis skiltyje \u201e\u017dmon\u0117s\u201c. Jie gal\u0117s sekti, komentuoti ar pa\u017eym\u0117ti \u201ePatinka\u201c visas id\u0117jas, nuotaikas, b\u016bsenos atnaujinimus, nuorodas ar dokumentus, kuriais dalijat\u0117s.
UIActivity.exo.label.paragraph6=Kurkite bendradarbiavimo erdves savo komandoms, projektams ar bendruomen\u0117ms arba prisijunkite prie j\u0173.
UIActivity.exo.label.paragraph7=Prad\u0117kime!


