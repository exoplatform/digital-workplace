UIActivity.exo.label.paragraph1=Grazie per esserla unito a eXo Platform.
UIActivity.exo.label.paragraph2=eXo Platform \u00e8 una soluzione di lavoro digitale che La aiuta a connettere e coinvolgere i Suoi team attorno a un'interfaccia centralizzata.
UIActivity.exo.label.paragraph3=eXo Platform migliora la comunicazione interna, stimola la collaborazione e gestisce la conoscenza aziendale.
UIActivity.exo.label.paragraph4=Questo \u00e8 il Suo flusso. Le aiuter\u00e0 a tenere d'occhio le cose importanti che accadono nei Suoi spazi.
UIActivity.exo.label.paragraph5=Costruisca la Sua rete connettendosi con i colleghi in Persone. Potranno seguire, commentare o mettere mi piace a tutte le idee, gli stati d'animo, gli aggiornamenti di stato, i collegamenti o i documenti che condivide sopra.
UIActivity.exo.label.paragraph6=Crei Spazi di collaborazione o si unisca a quelli esistenti per i Suoi team, progetti o comunit\u00e0.
UIActivity.exo.label.paragraph7=Iniziamo !


