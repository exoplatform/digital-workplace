UIActivity.exo.label.Welcome_Activity_Welcome_Onboard=Bun venit la bord, {0}!
UIActivity.exo.label.paragraph1=V\u0103 mul\u021bumim c\u0103 v-a\u021bi al\u0103turat eXo Platform.
UIActivity.exo.label.paragraph2=eXo Platform este o solu\u021bie de spa\u021biu de lucru digital care v\u0103 ajut\u0103 s\u0103 v\u0103 conecta\u021bi \u0219i s\u0103 v\u0103 implica\u021bi echipele \u00een jurul unei interfe\u021be centralizate.
UIActivity.exo.label.paragraph3=eXo Platform \u00eembun\u0103t\u0103\u021be\u0219te comunicarea intern\u0103, stimuleaz\u0103 colaborarea \u0219i gestioneaz\u0103 cuno\u0219tin\u021bele de business.
UIActivity.exo.label.paragraph4=Acesta este fluxul dumneavoastr\u0103 de activitate. V\u0103 ajut\u0103 s\u0103 urm\u0103ri\u021bi lucrurile importante care se \u00eent\u00e2mpl\u0103 \u00een spa\u021biile dumneavoastr\u0103.
UIActivity.exo.label.paragraph5=Construi\u021bi-v\u0103 re\u021beaua conect\u00e2ndu-v\u0103 cu colegii din Persoane. Ace\u0219tia vor putea urm\u0103ri, comenta sau aprecia toate ideile, st\u0103rile, actualiz\u0103rile de status, linkurile sau documentele pe care le partaja\u021bi mai sus.
UIActivity.exo.label.paragraph6=Crea\u021bi sau al\u0103tura\u021bi-v\u0103 spa\u021biilor de colaborare pentru echipele, proiectele sau comunit\u0103\u021bile dumneavoastr\u0103.
UIActivity.exo.label.paragraph7=S\u0103 \u00eencepem!


