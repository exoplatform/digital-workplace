UIActivity.exo.label.Welcome_Activity_Welcome_Onboard=V\u00edtejte na palub\u011b {0}!
UIActivity.exo.label.paragraph1=D\u011bkujeme, \u017ee jste se p\u0159ipojili k eXo Platform.
UIActivity.exo.label.paragraph2=eXo Platform je \u0159e\u0161en\u00ed pro digit\u00e1ln\u00ed pracovi\u0161t\u011b, kter\u00e9 v\u00e1m pom\u016f\u017ee propojit a zapojit va\u0161e t\u00fdmy prost\u0159ednictv\u00edm centralizovan\u00e9ho rozhran\u00ed.
UIActivity.exo.label.paragraph3=eXo Platform zlep\u0161uje intern\u00ed komunikaci, podporuje spolupr\u00e1ci a spravuje firemn\u00ed znalosti.
UIActivity.exo.label.paragraph4=Toto je v\u00e1\u0161 stream. Pom\u016f\u017ee v\u00e1m sledovat d\u016fle\u017eit\u00e9 v\u011bci, kter\u00e9 se d\u011bj\u00ed ve va\u0161ich prostor\u00e1ch.
UIActivity.exo.label.paragraph5=Vytvo\u0159te si s\u00ed\u0165 kontakt\u016f spojen\u00edm s kolegy v aplikaci Lid\u00e9. Budou moci sledovat, komentovat nebo ozna\u010dit To se mi l\u00edb\u00ed u v\u0161ech n\u00e1pad\u016f, n\u00e1lad, aktualizac\u00ed stavu, odkaz\u016f nebo dokument\u016f, kter\u00e9 v\u00fd\u0161e sd\u00edl\u00edte.
UIActivity.exo.label.paragraph6=Vytvo\u0159te prostory pro spolupr\u00e1ci pro sv\u00e9 t\u00fdmy, projekty nebo komunity, nebo se k nim p\u0159ipojte.
UIActivity.exo.label.paragraph7=Za\u010dn\u011bme!


