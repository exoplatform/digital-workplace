UIActivity.exo.label.Welcome_Activity_Welcome_Onboard=Welkom {0}!
UIActivity.exo.label.paragraph1=Bedankt voor uw deelname aan het eXo Platform.
UIActivity.exo.label.paragraph2=eXo Platform is een digitale werkplekoplossing waarmee u uw teams via een gecentraliseerde interface met elkaar kunt verbinden en betrekken.
UIActivity.exo.label.paragraph3=eXo Platform verbetert de interne communicatie, stimuleert samenwerking en beheert bedrijfskennis.
UIActivity.exo.label.paragraph4=Dit is jouw stream. Hiermee houd je de belangrijkste dingen in je werkruimtes in de gaten.
UIActivity.exo.label.paragraph5=Breid je netwerk uit door contact te leggen met collega's in Personen. Zij kunnen alle idee\u00ebn, stemmingen, statusupdates, links of documenten die je hierboven deelt, volgen, erop reageren of liken.
UIActivity.exo.label.paragraph6=Cre\u00eber of neem deel aan samenwerkingsruimten voor uw teams, projecten of communities.
UIActivity.exo.label.paragraph7=Laten we beginnen!


