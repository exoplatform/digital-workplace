UIActivity.exo.label.Welcome_Activity_Welcome_Onboard=V\u00e4lkommen ombord {0}!
UIActivity.exo.label.paragraph1=Tack f\u00f6r att du gick med i eXo Platform.
UIActivity.exo.label.paragraph2=eXo Platform \u00e4r en digital arbetsplats som hj\u00e4lper dig att koppla samman och engagera dina team kring ett centralt gr\u00e4nssnitt.
UIActivity.exo.label.paragraph3=eXo Platform f\u00f6rb\u00e4ttrar den interna kommunikationen, stimulerar samarbetet och hanterar verksamhetens kunskap.
UIActivity.exo.label.paragraph4=Det h\u00e4r \u00e4r ditt fl\u00f6de. Det hj\u00e4lper dig att h\u00e5lla koll p\u00e5 viktiga saker som h\u00e4nder i dina utrymmen.
UIActivity.exo.label.paragraph5=Bygg upp ditt n\u00e4tverk genom att l\u00e4gga till kollegor som kontakter i Personer. De kan f\u00f6lja, kommentera eller gilla alla id\u00e9er, st\u00e4mningar, statusuppdateringar, l\u00e4nkar och dokument som du delar ovan.
UIActivity.exo.label.paragraph6=Skapa eller g\u00e5 med i samarbetsutrymmen f\u00f6r dina team, projekt eller gemenskaper.
UIActivity.exo.label.paragraph7=Nu s\u00e4tter vi ig\u00e5ng!


