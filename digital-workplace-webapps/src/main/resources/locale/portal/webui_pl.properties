UIActivity.exo.label.Welcome_Activity_Welcome_Onboard=Witamy na pok\u0142adzie, {0}!
UIActivity.exo.label.paragraph1=Dzi\u0119kujemy za do\u0142\u0105czenie do eXo Platform.
UIActivity.exo.label.paragraph2=eXo Platform to rozwi\u0105zanie cyfrowego miejsca pracy, kt\u00f3re pomaga \u0142\u0105czy\u0107 i anga\u017cowa\u0107 zespo\u0142y wok\u00f3\u0142 scentralizowanego interfejsu.
UIActivity.exo.label.paragraph3=eXo Platform usprawnia komunikacj\u0119 wewn\u0119trzn\u0105, stymuluje wsp\u00f3\u0142prac\u0119 i zarz\u0105dza wiedz\u0105 biznesow\u0105.
UIActivity.exo.label.paragraph4=To jest strumie\u0144 aktywno\u015bci. Pozwala \u015bledzi\u0107 wa\u017cne wydarzenia w przestrzeniach.
UIActivity.exo.label.paragraph5=Rozbuduj sie\u0107 kontakt\u00f3w, \u0142\u0105cz\u0105c si\u0119 ze wsp\u00f3\u0142pracownikami w sekcji Osoby. B\u0119d\u0105 mogli obserwowa\u0107, komentowa\u0107 i polubi\u0107 wszystkie pomys\u0142y, nastroje, aktualizacje statusu, linki i dokumenty udost\u0119pnione powy\u017cej.
UIActivity.exo.label.paragraph6=Utw\u00f3rz lub do\u0142\u0105cz do przestrzeni wsp\u00f3\u0142pracy dla swoich zespo\u0142\u00f3w, projekt\u00f3w lub spo\u0142eczno\u015bci.
UIActivity.exo.label.paragraph7=Zaczynajmy!


