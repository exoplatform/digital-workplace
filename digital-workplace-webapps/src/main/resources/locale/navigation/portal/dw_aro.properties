portal.dw.name=\u062d\u0642\u0648\u0642 \u0627\u0644\u0637\u0628\u0639 \u0648\u0627\u0644\u0646\u0634\u0631 \u00a9 2019 eXo Platform SAS.\n\n\u0647\u0630\u0627 \u0628\u0631\u0646\u0627\u0645\u062c \u062d\u0631\u061b \u064a\u0645\u0643\u0646\u0643 \u0625\u0639\u0627\u062f\u0629 \u062a\u0648\u0632\u064a\u0639\u0647 \u0648/\u0623\u0648 \u062a\u0639\u062f\u064a\u0644\u0647 \u0628\u0645\u0648\u062c\u0628 \u0634\u0631\u0648\u0637 \u0631\u062e\u0635\u0629 \u062c\u0646\u0648 \u0627\u0644\u0639\u0645\u0648\u0645\u064a\u0629 \u0627\u0644\u0635\u063a\u0631\u0649 \u0643\u0645\u0627 \u0646\u0634\u0631\u062a\u0647\u0627 \u0645\u0624\u0633\u0633\u0629 \u0627\u0644\u0628\u0631\u0645\u062c\u064a\u0627\u062a \u0627\u0644\u062d\u0631\u0629\u061b \u0625\u0645\u0627 \u0627\u0644\u0625\u0635\u062f\u0627\u0631 3 \u0645\u0646 \u0627\u0644\u0631\u062e\u0635\u0629\u060c \u0623\u0648 (\u062d\u0633\u0628 \u0631\u063a\u0628\u062a\u0643) \u0623\u064a \u0625\u0635\u062f\u0627\u0631 \u0644\u0627\u062d\u0642.\n\n\u064a\u064f\u0648\u0632\u0639 \u0647\u0630\u0627 \u0627\u0644\u0628\u0631\u0646\u0627\u0645\u062c \u0639\u0644\u0649 \u0623\u0645\u0644 \u0623\u0646 \u064a\u0643\u0648\u0646 \u0645\u0641\u064a\u062f\u064b\u0627\u060c \u0648\u0644\u0643\u0646 \u062f\u0648\u0646 \u0623\u064a \u0636\u0645\u0627\u0646\u061b \u062d\u062a\u0649 \u062f\u0648\u0646 \u0627\u0644\u0636\u0645\u0627\u0646 \u0627\u0644\u0636\u0645\u0646\u064a \u0644\u0642\u0627\u0628\u0644\u064a\u0629 \u0627\u0644\u062a\u0633\u0648\u064a\u0642 \u0623\u0648 \u0627\u0644\u0645\u0644\u0627\u0621\u0645\u0629 \u0644\u063a\u0631\u0636 \u0645\u0639\u064a\u0646. \u0631\u0627\u062c\u0639 \u0631\u062e\u0635\u0629 \u062c\u0646\u0648 \u0627\u0644\u0639\u0645\u0648\u0645\u064a\u0629 \u0627\u0644\u0635\u063a\u0631\u0649 \u0644\u0645\u0632\u064a\u062f \u0645\u0646 \u0627\u0644\u062a\u0641\u0627\u0635\u064a\u0644.\n\n\u0645\u0646 \u0627\u0644\u0645\u0641\u062a\u0631\u0636 \u0623\u0646 \u062a\u0643\u0648\u0646 \u0642\u062f \u0627\u0633\u062a\u0644\u0645\u062a \u0646\u0633\u062e\u0629 \u0645\u0646 \u0631\u062e\u0635\u0629 \u062c\u0646\u0648 \u0627\u0644\u0639\u0645\u0648\u0645\u064a\u0629 \u0627\u0644\u0635\u063a\u0631\u0649 \u0645\u0639 \u0647\u0630\u0627 \u0627\u0644\u0628\u0631\u0646\u0627\u0645\u062c\u061b \u0648\u0625\u0644\u0627\u060c \u064a\u064f\u0631\u062c\u0649 \u0645\u0631\u0627\u0633\u0644\u0629 \u0645\u0624\u0633\u0633\u0629 \u0627\u0644\u0628\u0631\u0645\u062c\u064a\u0627\u062a \u0627\u0644\u062d\u0631\u0629\u060c 51 \u0634\u0627\u0631\u0639 \u0641\u0631\u0627\u0646\u0643\u0644\u064a\u0646\u060c \u0627\u0644\u0637\u0627\u0628\u0642 \u0627\u0644\u062e\u0627\u0645\u0633\u060c \u0628\u0648\u0633\u0637\u0646\u060c \u0645\u0627\u0633\u0627\u062a\u0634\u0648\u0633\u062a\u0633 02110-1301\u060c \u0627\u0644\u0648\u0644\u0627\u064a\u0627\u062a \u0627\u0644\u0645\u062a\u062d\u062f\u0629 \u0627\u0644\u0623\u0645\u0631\u064a\u0643\u064a\u0629\u060c \u0623\u0648 \u0632\u064a\u0627\u0631\u0629 \u0645\u0648\u0642\u0639 \u0627\u0644\u0645\u0624\u0633\u0633\u0629: http://www.fsf.org.
